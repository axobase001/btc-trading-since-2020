name: BTC ETH 15m KDJ backtest
on:
  push:
    branches:
      - experiments/kdj-15m-btc-eth-20261106
    paths:
      - scripts/kdj_15m_backtest.py
      - .github/workflows/kdj-15m-backtest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official Binance Vision data and backtest
        run: python scripts/kdj_15m_backtest.py
      - name: Upload trade logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdj-15m-btc-eth-results
          path: kdj_15m_results/
          if-no-files-found: warn
